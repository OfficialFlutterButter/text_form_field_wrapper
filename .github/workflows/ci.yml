name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - release/1.x
      - release/1.1
      - release/2.0

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter-version: ['3.47.0', 'stable']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Analyze package
        run: flutter analyze

      - name: Run package tests
        run: flutter test --coverage --exclude-tags golden

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Analyze example
        run: flutter analyze
        working-directory: example

      - name: Build example web
        if: matrix.flutter-version == 'stable'
        run: flutter build web --release
        working-directory: example

      - name: Publish dry run
        run: dart pub publish --dry-run

  pana:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Install pana
        run: dart pub global activate pana

      - name: Score package
        run: dart pub global run pana --exit-code-threshold 0 --no-warning .
